[project]
name = "dobrokek-pack-builder"
version = "0.1.0"
description = "Local Telegram pack builder for Dobrokek Quiz"
requires-python = ">=3.12"
dependencies = [
  "jsonschema[format]>=4.23,<5",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "Telethon>=1.36,<2"
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "ruff>=0.9,<1"]

[project.scripts]
dobrokek-pack = "dobrokek_pack_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dobrokek_pack_builder"]

[tool.hatch.build.targets.wheel.force-include]
"../shared/pack-schema.json" = "dobrokek_pack_builder/pack-schema.json"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.poetry]
package-mode = false
