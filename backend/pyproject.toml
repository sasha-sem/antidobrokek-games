[project]
name = "dobrokek-quiz-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<0.21",
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "jsonschema[format]>=4.23,<5",
  "pydantic-settings>=2.7,<3",
  "python-multipart>=0.0.20,<1",
  "SQLAlchemy>=2.0.36,<3",
  "uvicorn[standard]>=0.34,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
  "ruff>=0.9,<1"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]

[tool.poetry]
package-mode = false
